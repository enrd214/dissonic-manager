workflows:
  ios-unsigned:
    name: iOS Unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_WORKSPACE: ios/inventoryapp.xcworkspace
        XCODE_SCHEME: inventoryapp
      node: 22.14.0
      xcode: 16.4
      cocoapods: default
    scripts:
      - name: Install JavaScript dependencies
        script: npm ci
      - name: Generate native iOS project
        script: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
      - name: Build unsigned iOS archive
        script: |
          mkdir -p build/ios/unsigned
          xcodebuild archive \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/build/ios/unsigned/inventoryapp.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package unsigned IPA
        script: |
          APP_PATH="$CM_BUILD_DIR/build/ios/unsigned/inventoryapp.xcarchive/Products/Applications/inventoryapp.app"
          PAYLOAD_PATH="$CM_BUILD_DIR/build/ios/unsigned/Payload"
          test -d "$APP_PATH"
          mkdir -p "$PAYLOAD_PATH"
          cp -R "$APP_PATH" "$PAYLOAD_PATH/inventoryapp.app"
          cd "$CM_BUILD_DIR/build/ios/unsigned"
          zip -qry inventoryapp-unsigned.ipa Payload
    artifacts:
      - build/ios/unsigned/inventoryapp-unsigned.ipa
      - build/ios/unsigned/inventoryapp.xcarchive
      - /tmp/xcodebuild_logs/*.log

  ios-development:
    name: iOS Development Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      groups:
        - app_store_connect_credentials
      vars:
        APP_ID: com.dissonic.buildmanager
        XCODE_WORKSPACE: ios/inventoryapp.xcworkspace
        XCODE_SCHEME: inventoryapp
      ios_signing:
        distribution_type: development
        bundle_identifier: com.dissonic.buildmanager
      node: 22.14.0
      xcode: 16.4
      cocoapods: default
    scripts:
      - name: Install JavaScript dependencies
        script: npm ci
      - name: Generate native iOS project
        script: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
      - name: Set up iOS signing
        script: xcode-project use-profiles
      - name: Build development IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-release:
    name: iOS Release IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      groups:
        - app_store_connect_credentials
      vars:
        APP_ID: com.dissonic.buildmanager
        XCODE_WORKSPACE: ios/inventoryapp.xcworkspace
        XCODE_SCHEME: inventoryapp
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dissonic.buildmanager
      node: 22.14.0
      xcode: 16.4
      cocoapods: default
    scripts:
      - name: Install JavaScript dependencies
        script: npm ci
      - name: Generate native iOS project
        script: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
      - name: Set up iOS signing
        script: xcode-project use-profiles
      - name: Build release IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
