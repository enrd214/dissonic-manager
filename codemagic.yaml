workflows:
  ios-development:
    name: iOS Development Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      groups:
        - app_store_connect_credentials
      vars:
        APP_ID: com.dissonic.buildmanager
        XCODE_WORKSPACE: ios/inventoryapp.xcworkspace
        XCODE_SCHEME: inventoryapp
      ios_signing:
        distribution_type: development
        bundle_identifier: com.dissonic.buildmanager
      node: 22.14.0
      xcode: 16.4
      cocoapods: default
    scripts:
      - name: Install JavaScript dependencies
        script: npm ci
      - name: Generate native iOS project
        script: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
      - name: Set up iOS signing
        script: xcode-project use-profiles
      - name: Build development IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-release:
    name: iOS Release IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      groups:
        - app_store_connect_credentials
      vars:
        APP_ID: com.dissonic.buildmanager
        XCODE_WORKSPACE: ios/inventoryapp.xcworkspace
        XCODE_SCHEME: inventoryapp
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dissonic.buildmanager
      node: 22.14.0
      xcode: 16.4
      cocoapods: default
    scripts:
      - name: Install JavaScript dependencies
        script: npm ci
      - name: Generate native iOS project
        script: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
      - name: Set up iOS signing
        script: xcode-project use-profiles
      - name: Build release IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
