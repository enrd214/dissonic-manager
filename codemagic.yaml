workflows:
  ios-unsigned:
    name: Unsigned iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Generate native iOS project
        script: npx expo prebuild --platform ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
      - name: Build without signing
        script: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" -print -quit)
          if [ -z "$WORKSPACE" ]; then
            echo "No iOS workspace was generated after pod install."
            find ios -maxdepth 2 -type f | sort
            exit 1
          fi
          PROJECT=$(find ios -maxdepth 1 -name "*.xcodeproj" -print -quit)
          SCHEME=$(basename "$PROJECT" .xcodeproj)
          if [ -z "$SCHEME" ]; then
            echo "No iOS Xcode project was generated."
            exit 1
          fi
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        script: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "No compiled iOS app was found."
            find build -maxdepth 5 -type d | sort
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry BuildManager.ipa Payload
    artifacts:
      - BuildManager.ipa
